groups:
- name: herzi
  rules:
  - alert: HerziPoolNeedsHardware
    expr: herzi_pool_probe_mode == 1 and on(pool) herzi_pool_failure_class{class="capacity"}
      == 1
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Pool {{ $labels.pool }} needs hardware
      description: Capacity failures keep this pool in probe mode; check its need
        gauge and server-scan inventory.
      runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#needs-hardware
  - alert: HerziInstallFailing
    expr: herzi_pool_failure_class{class="other"} == 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Pool {{ $labels.pool }} installs are failing
      description: Non-capacity failures require investigation; the metric catalogue
        has no failure-type label, so inspect workflow history.
      runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#install-failing
  # Every other alert compares a herzi series, and a crashed or never-started controller has none, so
  # it would stay silent exactly when it matters. absent() is the only expression that fires then.
  - alert: HerziControllerDown
    expr: absent(herzi_config_valid)
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: herzi exports no metrics
      description: The controller is not running, is crash-looping (check RBAC and its log), or Prometheus
        cannot scrape it. Nothing is keeping any pool filled while this fires.
      runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#controller-down
  # A pool that is paused on purpose (annotation or config) or waiting out its own block is not an incident.
  - alert: HerziPoolBlocked
    expr: herzi_pool_blocked{reason!~"paused|blocked_until"} == 1
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: 'Pool {{ $labels.pool }} blocked: {{ $labels.reason }}'
      description: The pool has been unable to act for 15 minutes; inspect this
        reason before changing demand or retrying installs.
      runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#pool-blocked
  - alert: HerziStuckAgents
    expr: herzi_pool_stuck_agents > 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Pool {{ $labels.pool }} has stuck Agents
      description: Unbound Agents exceeded settlingMax and no longer count as available
        supply.
      runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#stuck-agents
  - alert: HerziStuckOpenRuns
    expr: herzi_oldest_open_run_seconds > ignoring(pool) group_left herzi_stuck_after_seconds
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Pool {{ $labels.pool }} has an install open beyond the configured stuck threshold
      description: Open runs remain counted as supply; inspect Temporal history
        and worker activity.
      runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#stuck-open-runs
  - alert: HerziQueueHasNoPollers
    expr: herzi_pollers == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: No pollers on {{ $labels.queue }} queue
      description: Growth is blocked because a required worker queue has no pollers;
        detection can lag worker death by about five minutes.
      runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#no-pollers
  - alert: HerziNotReconciling
    expr: time() - herzi_last_successful_reconcile_timestamp_seconds > 600
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Pool {{ $labels.pool }} has no recent successful reconcile
      description: Last successful reconcile is older than ten minutes; inspect
        leadership, controller health and dependencies.
      runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#not-reconciling
  - alert: HerziConfigInvalid
    expr: herzi_config_valid == 0
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: The latest herzi config update was rejected
      description: The last good snapshot remains active; correct invalid YAML,
        unknown keys or invalid values and reapply.
      runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#config-invalid
  - alert: HerziAssignedExceedsDemand
    expr: herzi_pool_assigned > on(pool) herzi_pool_demand
    for: 3h
    labels:
      severity: warning
    annotations:
      summary: Pool {{ $labels.pool }} assigned exceeds demand
      description: Agents may remain bound after a NodePool is paused/deleted; verify
        ownership before repairing HyperShift state.
      runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#assigned-exceeds-demand
