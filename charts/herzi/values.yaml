image:
  repository: ""
  tag: "" # Empty selects Chart.appVersion.
  pullPolicy: IfNotPresent
goMemLimit: 400MiB # About 80% of the default memory limit.
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
serviceAccount:
  create: true
  name: "" # Release name when created; default otherwise.
  annotations: {}
rbac:
  create: true
  metricsReader:
    subjects: [] # Subjects allowed to GET /metrics.
config:
  interval: 120s # Reconcile period; live reload.
  reconcileTimeout: 60s # Reconcile deadline; live reload.
  hubName: "" # Required MCE hub name.
  agentNamespace: inventory # Agent/InfraEnv namespace.
  installURL: "" # Required absolute HTTP(S) install endpoint.
  maxSlots: 100 # Fixed at 100 API slots.
  ambiguousWait: 5m # Block after an unclear POST; live reload.
  stuckAfter: 2h # Open-run warning age; startup-bound.
  temporalAddress: "" # Required Temporal host:port.
  temporalNamespace: default # Temporal namespace.
  activityQueue: "" # Empty derives server-lifecycle-activity-<canonical hubName>.
  workflowQueue: install-server-workflow # Workflow worker queue.
  segmentQueue: segment-lifecycle-activity # Segment worker queue.
  defaults:
    highPct: 10 # Spare percentage (0..1000), half-up rounding.
    minFree: 2 # Minimum spare buffer (0..100000).
    maxOpenRunsPerPool: 15 # Maximum concurrent pool runs (1..100).
    probeInterval: 20m # Hardware shortage probe period.
    drawGrace: 2m # Wait for acquisition evidence; less than probeInterval.
    failureMemory: 6h # Remember failures; at least twice probeInterval.
    settlingMax: 60m # Unbound Agent age; at least probeInterval.
    dryRunGrow: false # Record intended orders without calling install-server.
    paused: false # Suspend growth for this pool.
  pools: {} # InfraEnv name to overrides; presence opts in.
temporal:
  tls:
    existingSecret: ""
    caKey: ca.crt
metrics:
  enabled: true # HTTPS metrics Service.
  port: 8443
serviceMonitor:
  enabled: false # Requires Prometheus Operator CRDs.
  interval: 30s
  labels: {}
  endpoint: {} # Raw ServiceMonitor endpoint fields.
prometheusRule:
  enabled: false # Requires Prometheus Operator CRDs.
  labels: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
imagePullSecrets: []
extraArgs: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
