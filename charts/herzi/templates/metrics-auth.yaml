{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "herzi.fullname" . }}-metrics-auth
  labels:
    {{- include "herzi.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "herzi.fullname" . }}-metrics-auth
  labels:
    {{- include "herzi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "herzi.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "herzi.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "herzi.fullname" . }}-metrics-reader
  labels:
    {{- include "herzi.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
{{- with .Values.rbac.metricsReader.subjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "herzi.fullname" $ }}-metrics-reader
  labels:
    {{- include "herzi.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "herzi.fullname" $ }}-metrics-reader
subjects: {{ toYaml . | nindent 2 }}
{{- end }}
{{- end }}
