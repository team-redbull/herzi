{{- if .Values.temporal.tls.caCert }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "herzi.temporalCASecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "herzi.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.temporal.tls.caKey }}: {{ .Values.temporal.tls.caCert | b64enc }}
{{- end }}
