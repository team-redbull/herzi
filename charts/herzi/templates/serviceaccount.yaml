{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "herzi.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "herzi.labels" . | nindent 4 }}
  annotations: {{ toYaml .Values.serviceAccount.annotations | nindent 4 }}
{{- end }}
