{{- if .Values.installer.tls.caCert }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "herzi.installCASecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "herzi.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.installer.tls.caKey }}: {{ .Values.installer.tls.caCert | b64enc }}
{{- end }}
