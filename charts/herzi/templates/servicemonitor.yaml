{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "herzi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml (merge (include "herzi.labels" . | fromYaml) .Values.serviceMonitor.labels) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "herzi.selectorLabels" . | nindent 6 }}
  endpoints:
    - path: /metrics
      port: https
      scheme: https
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      tlsConfig: {{ toYaml .Values.serviceMonitor.tlsConfig | nindent 8 }}
      {{- with .Values.serviceMonitor.bearerTokenSecret }}
      bearerTokenSecret: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
