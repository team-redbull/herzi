{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml (merge (include "herzi.labels" . | fromYaml) .Values.serviceMonitor.labels) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "herzi.selectorLabels" . | nindent 6 }}
  endpoints:
    - {{- toYaml (mergeOverwrite (dict "path" "/metrics" "port" "https" "scheme" "https" "interval" .Values.serviceMonitor.interval) .Values.serviceMonitor.endpoint) | nindent 6 }}
{{- end }}
