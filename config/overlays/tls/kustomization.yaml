# Example overlay: the default install plus TLS to Temporal (verified against your CA) and a metrics
# certificate you provide. Copy it per hub and keep only the components whose Secrets exist.
# Add ../../components/temporal-mtls for mutual TLS (needs tls.crt/tls.key in herzi-temporal-tls).
# The default install ships NO herzi-config: add your ConfigMap, or build ../example to try it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../default
components:
- ../../components/temporal-tls
- ../../components/metrics-tls
