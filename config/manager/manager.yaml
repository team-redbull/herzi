# Design Part 2, Framework: "one active reconciler".
# No PDB: minAvailable=1 on a single replica prevents voluntary maintenance;
# maxUnavailable=1 would provide no protection. Rollouts intentionally accept downtime.
# Optional TLS material is NOT mounted here: a required Secret that does not exist would keep the pod
# from starting on a hub that uses plain gRPC (the default). Add ../components/temporal-tls and/or
# ../components/metrics-tls to the overlay when the Secrets exist. See docs/ops/operating.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: herzi
  labels: &id001
    app.kubernetes.io/name: herzi
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: controller:dev
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        - --config=/etc/herzi/config.yaml
        ports:
        - name: health
          containerPort: 8081
        - name: https
          containerPort: 8443
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: HERZI_API_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: herzi-api
              key: token
              optional: true
        volumeMounts:
        - name: config
          mountPath: /etc/herzi
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: herzi-config
