# role.yaml is GENERATED by `make manifests` from the +kubebuilder:rbac markers in internal/controller;
# never edit it by hand. Without it the controller cannot read Agents, InfraEnvs or NodePools.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- service_account.yaml
- role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
- metrics_auth_role.yaml
- metrics_auth_role_binding.yaml
- metrics_reader_role.yaml
