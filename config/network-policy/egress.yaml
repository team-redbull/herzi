# EXAMPLE ONLY: replace TEST-NET /32s with API server, Temporal, workflows IPs.
# Check pre/post-DNAT handling and node-local DNS with your CNI before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: herzi-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: herzi
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 192.0.2.10/32
    ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 192.0.2.20/32
    ports:
    - port: 7233
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 192.0.2.30/32
    ports:
    - port: 443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
