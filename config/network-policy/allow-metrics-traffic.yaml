apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: herzi
    app.kubernetes.io/managed-by: kustomize
  name: herzi-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: herzi
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          metrics: enabled
    ports:
    - port: 8443
      protocol: TCP
