# Promtool consumes native rule groups, not a Kubernetes PrometheusRule wrapper.
# Extract herzi-alerts.yaml's spec to herzi-alerts.rules.yaml in a TEMP directory,
# copy this test there, then run: promtool test rules herzi-alerts.test.yaml
# Full reproducible command: docs/ops/operating.md, "Alert rule tests".
# This test file is intentionally absent from kustomization.yaml resources.
rule_files:
- herzi-alerts.rules.yaml
evaluation_interval: 1m
group_eval_order:
- herzi
tests:
- name: Stuck age uses one unlabeled configured threshold for multiple pools
  interval: 1m
  input_series:
  - series: herzi_config_valid
    values: 1x10
  - series: herzi_stuck_after_seconds
    values: 1800x10
  - series: herzi_oldest_open_run_seconds{pool="older"}
    values: 1801x10
  - series: herzi_oldest_open_run_seconds{pool="equal"}
    values: 1800x10
  - series: herzi_oldest_open_run_seconds{pool="younger"}
    values: 1799x10
  alert_rule_test:
  - eval_time: 4m
    alertname: HerziStuckOpenRuns
    exp_alerts: []
  - eval_time: 5m
    alertname: HerziStuckOpenRuns
    exp_alerts:
    - exp_labels:
        pool: older
        severity: warning
      exp_annotations:
        summary: Pool older has an install open beyond the configured stuck threshold
        description: Open runs remain counted as supply; inspect Temporal history and worker activity.
        runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#stuck-open-runs
- name: Only sustained assigned excess fires after three hours; free spares alone do not
  interval: 1m
  input_series:
  - series: herzi_config_valid
    values: 1x181
  - series: herzi_pool_demand{pool="spares"}
    values: 20x181
  - series: herzi_pool_assigned{pool="spares"}
    values: 20x181
  - series: herzi_pool_claimable{pool="spares"}
    values: 100x181
  - series: herzi_pool_settling{pool="spares"}
    values: 50x181
  - series: herzi_pool_demand{pool="bound-excess"}
    values: 20x181
  - series: herzi_pool_assigned{pool="bound-excess"}
    values: 21x181
  alert_rule_test:
  - eval_time: 179m
    alertname: HerziAssignedExceedsDemand
    exp_alerts: []
  - eval_time: 180m
    alertname: HerziAssignedExceedsDemand
    exp_alerts:
    - exp_labels:
        pool: bound-excess
        severity: warning
      exp_annotations:
        summary: Pool bound-excess assigned exceeds demand
        description: Agents may remain bound after a NodePool is paused/deleted; verify ownership before
          repairing HyperShift state.
        runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#assigned-exceeds-demand
- name: Absent controller series fires only after ten minutes
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 9m
    alertname: HerziControllerDown
    exp_alerts: []
  - eval_time: 10m
    alertname: HerziControllerDown
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: herzi exports no metrics
        description: The controller is not running, is crash-looping (check RBAC and its log), or Prometheus
          cannot scrape it. Nothing is keeping any pool filled while this fires.
        runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#controller-down
- name: Intentional pause and pending wait do not alert; a real block does
  interval: 1m
  input_series:
  - series: herzi_config_valid
    values: 1x20
  - series: herzi_pool_blocked{pool="paused-config",reason="paused"}
    values: 1x20
  - series: herzi_pool_blocked{pool="paused-annotation",reason="paused"}
    values: 1x20
  - series: herzi_pool_blocked{pool="waiting",reason="blocked_until"}
    values: 1x20
  - series: herzi_pool_blocked{pool="invalid",reason="config_invalid"}
    values: 1x20
  alert_rule_test:
  - eval_time: 14m
    alertname: HerziPoolBlocked
    exp_alerts: []
  - eval_time: 15m
    alertname: HerziPoolBlocked
    exp_alerts:
    - exp_labels:
        pool: invalid
        reason: config_invalid
        severity: warning
      exp_annotations:
        summary: 'Pool invalid blocked: config_invalid'
        description: The pool has been unable to act for 15 minutes; inspect this reason before changing
          demand or retrying installs.
        runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#pool-blocked

- name: Stuck threshold matches each controller target independently
  interval: 1m
  input_series:
  - series: herzi_config_valid{job="herzi",instance="fast:8080"}
    values: 1x10
  - series: herzi_config_valid{job="herzi",instance="slow:8080"}
    values: 1x10
  - series: herzi_stuck_after_seconds{job="herzi",instance="fast:8080"}
    values: 1800x10
  - series: herzi_stuck_after_seconds{job="herzi",instance="slow:8080"}
    values: 7200x10
  - series: herzi_oldest_open_run_seconds{job="herzi",instance="fast:8080",pool="fast-pool"}
    values: 2000x10
  - series: herzi_oldest_open_run_seconds{job="herzi",instance="slow:8080",pool="slow-pool"}
    values: 2000x10
  alert_rule_test:
  - eval_time: 4m
    alertname: HerziStuckOpenRuns
    exp_alerts: []
  - eval_time: 5m
    alertname: HerziStuckOpenRuns
    exp_alerts:
    - exp_labels:
        pool: fast-pool
        job: herzi
        instance: fast:8080
        severity: warning
      exp_annotations:
        summary: Pool fast-pool has an install open beyond the configured stuck threshold
        description: Open runs remain counted as supply; inspect Temporal history and worker activity.
        runbook_url: https://github.com/team-redbull/herzi/blob/main/docs/ops/runbook.md#stuck-open-runs
