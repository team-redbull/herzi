# Provision a rotating Prometheus credential and bind its ServiceAccount to metrics-reader.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: herzi
  labels: &id001
    app.kubernetes.io/name: herzi
spec:
  selector:
    matchLabels: *id001
  endpoints:
  - path: /metrics
    port: https
    scheme: https
    authorization:
      type: Bearer
      credentials:
        name: herzi-prometheus-token
        key: token
    tlsConfig:
      serverName: herzi-metrics.herzi-system.svc
      insecureSkipVerify: false
      ca:
        secret:
          name: herzi-metrics-tls
          key: ca.crt
