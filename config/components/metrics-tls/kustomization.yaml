# Opt-in: serve metrics with a certificate you provide (for example from cert-manager) instead of the
# self-signed one controller-runtime generates. Requires the Secret `herzi-metrics-tls` (tls.crt, tls.key).
# The ServiceMonitor in ../../prometheus verifies against this Secret's ca.crt, so monitoring needs it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    kind: Deployment
    name: herzi
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --metrics-cert-path=/etc/herzi-metrics
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value: {name: metrics-tls, mountPath: /etc/herzi-metrics, readOnly: true}
    - op: add
      path: /spec/template/spec/volumes/-
      value: {name: metrics-tls, secret: {secretName: herzi-metrics-tls, defaultMode: 292}}
