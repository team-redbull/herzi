name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt vet lint test vuln
      - name: Enforce core unit coverage of at least 90 percent
        shell: bash
        run: |
          for package in pipeline config; do
            awk -v p="/internal/$package/" '
              index($1,p) { total += $2; if ($3 > 0) covered += $2 }
              END { if (total == 0 || covered / total < 0.90) exit 1 }
            ' cover.out
          done
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-integration
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Helm (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          # Source: https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      - name: Install chart test YAML dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Install promtool (pinned, checksum-verified)
        env:
          PROMETHEUS_VERSION: 3.15.1
          # Source: https://github.com/prometheus/prometheus/releases/download/v3.15.1/sha256sums.txt
          PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          install -m 0755 "$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
      - name: Verify deployment chart and hack/chart fixtures
        run: make helm-lint helm-test test-alerts manifests-drift
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: make docker-build IMG=herzi:ci VERSION=ci COMMIT="$GITHUB_SHA"
  publish:
    name: Publish image (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, integration, chart, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine next version from Conventional Commits
        id: version
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: "v"

      - name: Verify the computed version moves forward
        env:
          NEW_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "previous tag: ${previous:-<none>}  ->  computed: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "::error::version step produced an empty tag"; exit 1
          fi
          if existing="$(git rev-parse -q --verify "refs/tags/$NEW_TAG^{commit}")"; then
            if [ "$existing" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$NEW_TAG already exists on ${existing:0:7} - refusing to re-tag"; exit 1
            fi
            echo "$NEW_TAG already points at this commit - re-run, keeping it"
          fi
          if [ -n "$previous" ] && [ "$(printf '%s\n%s\n' "$previous" "$NEW_TAG" | sort -V | tail -1)" != "$NEW_TAG" ]; then
            echo "::error::$NEW_TAG is not newer than $previous"; exit 1
          fi

      - name: Tag the release
        env:
          NEW_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
            echo "$NEW_TAG already exists - re-run, not re-tagging"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Publish the release notes
        env:
          NEW_TAG: ${{ steps.version.outputs.version_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "$NEW_TAG^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then range="$previous..$NEW_TAG"; else range="$NEW_TAG"; fi
          git log --no-merges --format=%s "$range" > "$RUNNER_TEMP/subjects.txt"
          python3 - "$NEW_TAG" "$previous" "$RUNNER_TEMP/subjects.txt" > "$RUNNER_TEMP/notes.md" <<'PY'
          import pathlib, re, sys

          tag, previous, subjects = sys.argv[1], sys.argv[2], sys.argv[3]
          pattern = re.compile(r"^(?P<type>[a-z]+)(?P<scope>\([^)]*\))?(?P<bang>!)?: (?P<rest>.+)$")
          headings = {"breaking": "Breaking", "feat": "New features", "fix": "Fixed",
                      "perf": "Performance", "docs": "Documentation"}
          groups, other = {}, []
          for line in (l.strip() for l in pathlib.Path(subjects).read_text().splitlines()):
              if not line:
                  continue
              m = pattern.match(line)
              if not m:
                  other.append(line)
                  continue
              key = "breaking" if m["bang"] else m["type"]
              if key in headings:
                  groups.setdefault(key, []).append(m["rest"])
          out = []
          for key, heading in headings.items():
              if groups.get(key):
                  out += [f"### {heading}\n"] + [f"- {i}" for i in groups[key]] + [""]
          if other:
              out += ["### Other\n"] + [f"- {i}" for i in other] + [""]
          if not out:
              out = ["No operator-visible changes in this release.", ""]
          if previous:
              out.append(f"**Full changelog:** {previous}...{tag}")
          print("\n".join(out))
          PY
          cat "$RUNNER_TEMP/notes.md"
          for attempt in 1 2 3; do
            if gh release view "$NEW_TAG" >/dev/null 2>&1; then echo "release exists"; break; fi
            gh release create "$NEW_TAG" --title "$NEW_TAG" --notes-file "$RUNNER_TEMP/notes.md" && break
            if [ "$attempt" = 3 ]; then echo "::error::could not create release $NEW_TAG"; exit 1; fi
            sleep 30
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version_tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version_tag }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
