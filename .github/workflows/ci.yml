name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          scope: lint
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/golangci-lint
          key: tool-golangci-lint-${{ runner.os }}-${{ runner.arch }}-v2.15.0-go${{ hashFiles('go.mod') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: golangci-analysis-${{ runner.os }}-
      - run: make fmt-check lint
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          scope: vuln
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/govulncheck
          key: tool-govulncheck-${{ runner.os }}-${{ runner.arch }}-v1.9.0-go${{ hashFiles('go.mod') }}
      - run: make vuln
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          scope: race
      - run: make test
      - name: Enforce core unit coverage of at least 90 percent
        shell: bash
        run: |
          for package in pipeline config; do
            awk -v p="/internal/$package/" '
              index($1,p) { total += $2; if ($3 > 0) covered += $2 }
              END { if (total == 0 || covered / total < 0.90) exit 1 }
            ' cover.out
          done
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          scope: integration
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/setup-envtest
            bin/k8s
          key: tool-envtest-${{ runner.os }}-${{ runner.arch }}-v0.25.0-k8s1.37.0-go${{ hashFiles('go.mod') }}
      - run: make test-integration
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          scope: chart
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/controller-gen
          key: tool-controller-gen-${{ runner.os }}-${{ runner.arch }}-v0.22.0-go${{ hashFiles('go.mod') }}
      - name: Install Helm (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          # Source: https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      - name: Install chart test YAML dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Install promtool (pinned, checksum-verified)
        env:
          PROMETHEUS_VERSION: 3.15.1
          # Source: https://github.com/prometheus/prometheus/releases/download/v3.15.1/sha256sums.txt
          PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          install -m 0755 "$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
      - name: Verify deployment chart and hack/chart fixtures
        run: make helm-lint helm-test test-alerts manifests-drift
  image:
    name: Image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine next version from Conventional Commits
        id: version
        if: github.ref == 'refs/heads/main'
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: "v"

      - uses: ./.github/actions/go
        with:
          scope: image

      # Compiled here so the Go build cache applies; the Dockerfile's `prebuilt` stage only copies the binary.
      - name: Build the static binary
        run: GOOS=linux GOARCH=amd64 make build VERSION="${{ steps.version.outputs.version || 'ci' }}" COMMIT="$GITHUB_SHA"

      - name: Build the image (never pushes)
        run: docker build --target prebuilt --build-arg VERSION="${{ steps.version.outputs.version || 'ci' }}" --build-arg COMMIT="$GITHUB_SHA" -t herzi:ci .

      # publish ships exactly this binary instead of restoring Go and compiling it again.
      - name: Keep the binary for publish
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: herzi-linux-amd64
          path: bin/manager
          retention-days: 1
          if-no-files-found: error
          overwrite: true # a re-run uploads the same name again

  publish:
    name: Publish image (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, vuln, unit, integration, chart, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify the computed version moves forward
        env:
          NEW_TAG: ${{ needs.image.outputs.version_tag }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "previous tag: ${previous:-<none>}  ->  computed: $NEW_TAG"
          if [ -z "$NEW_TAG" ]; then
            echo "::error::version step produced an empty tag"; exit 1
          fi
          if existing="$(git rev-parse -q --verify "refs/tags/$NEW_TAG^{commit}")"; then
            if [ "$existing" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$NEW_TAG already exists on ${existing:0:7} - refusing to re-tag"; exit 1
            fi
            echo "$NEW_TAG already points at this commit - re-run, keeping it"
          fi
          if [ -n "$previous" ] && [ "$(printf '%s\n%s\n' "$previous" "$NEW_TAG" | sort -V | tail -1)" != "$NEW_TAG" ]; then
            echo "::error::$NEW_TAG is not newer than $previous"; exit 1
          fi

      - name: Tag the release
        env:
          NEW_TAG: ${{ needs.image.outputs.version_tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
            echo "$NEW_TAG already exists - re-run, not re-tagging"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Publish the release notes
        env:
          NEW_TAG: ${{ needs.image.outputs.version_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "$NEW_TAG^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then range="$previous..$NEW_TAG"; else range="$NEW_TAG"; fi
          git log --no-merges --format=%s "$range" > "$RUNNER_TEMP/subjects.txt"
          python3 - "$NEW_TAG" "$previous" "$RUNNER_TEMP/subjects.txt" > "$RUNNER_TEMP/notes.md" <<'PY'
          import pathlib, re, sys

          tag, previous, subjects = sys.argv[1], sys.argv[2], sys.argv[3]
          pattern = re.compile(r"^(?P<type>[a-z]+)(?P<scope>\([^)]*\))?(?P<bang>!)?: (?P<rest>.+)$")
          headings = {"breaking": "Breaking", "feat": "New features", "fix": "Fixed",
                      "perf": "Performance", "docs": "Documentation"}
          groups, other = {}, []
          for line in (l.strip() for l in pathlib.Path(subjects).read_text().splitlines()):
              if not line:
                  continue
              m = pattern.match(line)
              if not m:
                  other.append(line)
                  continue
              key = "breaking" if m["bang"] else m["type"]
              if key in headings:
                  groups.setdefault(key, []).append(m["rest"])
          out = []
          for key, heading in headings.items():
              if groups.get(key):
                  out += [f"### {heading}\n"] + [f"- {i}" for i in groups[key]] + [""]
          if other:
              out += ["### Other\n"] + [f"- {i}" for i in other] + [""]
          if not out:
              out = ["No operator-visible changes in this release.", ""]
          if previous:
              out.append(f"**Full changelog:** {previous}...{tag}")
          print("\n".join(out))
          PY
          cat "$RUNNER_TEMP/notes.md"
          for attempt in 1 2 3; do
            if gh release view "$NEW_TAG" >/dev/null 2>&1; then echo "release exists"; break; fi
            gh release create "$NEW_TAG" --title "$NEW_TAG" --notes-file "$RUNNER_TEMP/notes.md" && break
            if [ "$attempt" = 3 ]; then echo "::error::could not create release $NEW_TAG"; exit 1; fi
            sleep 30
          done

      - name: Fetch the binary built in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herzi-linux-amd64
          path: bin

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: X.Y.Z, X.Y, X (not for 0.x), sha-<7 chars> and latest.
      - name: Build and push the image
        env:
          VERSION: ${{ needs.image.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          chmod 0755 bin/manager
          tags=("$VERSION" "${VERSION%.*}" "sha-${GITHUB_SHA::7}" latest)
          if [ "${VERSION%%.*}" != 0 ]; then tags+=("${VERSION%%.*}"); fi
          args=()
          for tag in "${tags[@]}"; do args+=(-t "${IMAGE,,}:$tag"); done
          docker build --target prebuilt --build-arg VERSION="$VERSION" --build-arg COMMIT="$GITHUB_SHA" "${args[@]}" .
          for tag in "${tags[@]}"; do docker push "${IMAGE,,}:$tag"; done
