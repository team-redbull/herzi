name: CI
on:
  push:
    branches: [main]
  pull_request:
# A new push to the same branch or PR cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt vet lint test vuln
      - name: Enforce core unit coverage of at least 90 percent
        shell: bash
        run: |
          for package in pipeline config; do
            awk -v p="/internal/$package/" '
              index($1,p) { total += $2; if ($3 > 0) covered += $2 }
              END { if (total == 0 || covered / total < 0.90) exit 1 }
            ' cover.out
          done
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-integration
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Go is needed to run controller-gen for the drift check.
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Every tree renders, schemas validate when kubeconform exists
        run: make lint-manifests
      # promtool is not on GitHub's runners. The version and the sha256 are pinned; the checksum is the one the
      # Prometheus project publishes in the release's sha256sums.txt.
      - name: Install promtool (pinned, checksum-verified)
        env:
          PROMETHEUS_VERSION: 3.15.1
          PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          install -m 0755 "$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
      - name: The shipped alert rules pass their unit tests
        run: make test-alerts
      - name: The default install grants the controller what it reads and patches
        run: make check-rbac
      - name: The committed role.yaml equals what the RBAC markers generate
        run: make manifests-drift
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: make docker-build IMG=herzi:ci VERSION=ci COMMIT="$GITHUB_SHA"
